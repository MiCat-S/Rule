name: Sync and convert rules

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-rules
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Advance Yuu518 rule-set submodule
        run: python scripts/sync_upstream.py

      - name: Convert rule sets
        run: python scripts/convert_rules.py

      - name: Run tests and freshness check
        run: |
          python -m unittest discover -s tests -v
          python scripts/convert_rules.py --check

      - name: Commit updated outputs
        run: |
          if [ -z "$(git status --porcelain -- generated upstream)" ]; then
            echo "Generated and mirrored files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated upstream
          git commit -m "chore: sync upstream and update rules"
          git push
